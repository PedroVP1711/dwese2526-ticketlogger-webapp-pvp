# application.properties
spring.application.name=dwese2526-ticketlogger-webapp-pvp

# URL de conexión y credenciales
spring.datasource.url=jdbc:mariadb://db:3306/ticket-logger-webapp
spring.datasource.username=PedroVp
spring.datasource.password=Pvp2025
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# Dialecto de Hibernate para MariaDB (compatible con MySQL)
spring.jpa.database-platform=org.hibernate.dialect.MariaDBDialect

# Mostrar las consultas SQL generadas en la consola
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Configuración del pool de conexiones
spring.datasource.hikari.maximum-pool-size=10

# Ruta raíz donde guardarás los ficheros de usuario (fuera del jar)
app.upload-root=${APP_UPLOAD_PATH}


# Spring Boot servirá recursos estáticos desde:
# - classpath:/static/  (css, js, imágenes del proyecto)
# - file:${app.upload-root}/  (directorio externo)
spring.web.resources.static-locations=classpath:/static/,file:${app.upload-root}/