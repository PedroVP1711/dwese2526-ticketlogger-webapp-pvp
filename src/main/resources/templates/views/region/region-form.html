<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/head :: head(#{region.form.title})"></head>

<body class="d-flex flex-column h-100">

<header th:replace="fragments/header :: header"></header>

<main class="form-page">
    <div class="form-card">
        <h1 th:if="${region.id == null}" th:text="#{msg.region-form.add}">Añadir Región</h1>
        <h1 th:if="${region.id != null}" th:text="#{msg.region-form.edit}">Editar Región</h1>

        <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

        <form th:action="${region.id} == null ? @{/regions/save} : @{/regions/update}" th:object="${region}" method="post" class="mt-3">

            <input type="hidden" th:field="*{id}" />

            <div class="mb-3">
                <label for="code" class="form-label" th:text="#{msg.region-form.code}">Código</label>
                <input type="text" id="code" th:field="*{code}" class="form-control" />
                <div th:if="${#fields.hasErrors('code')}" class="text-danger" th:errors="*{code}"></div>
            </div>

            <div class="mb-3">
                <label for="name" class="form-label" th:text="#{msg.region-form.name}">Nombre</label>
                <input type="text" id="name" th:field="*{name}" class="form-control" />
                <div th:if="${#fields.hasErrors('name')}" class="text-danger" th:errors="*{name}"></div>
            </div>

            <button th:if="${region.id == null}" type="submit" class="btn btn-primary" th:text="#{msg.region-form.create}">Crear</button>
            <button th:if="${region.id != null}" type="submit" class="btn btn-primary" th:text="#{msg.region-form.update}">Actualizar</button>

            <a th:href="@{/regions}" class="btn btn-secondary" th:text="#{msg.region-form.returnback}">Volver</a>

        </form>
    </div>
</main>

<footer th:replace="fragments/footer :: footer"></footer>
<div th:replace="fragments/scripts :: scripts"></div>

</body>
</html>
