<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/head :: head(#{region.list.title})"></head>
<body class="d-flex flex-column h-100">
<header th:replace="fragments/header :: header"></header>

<main class="container py-4">
    <h2 th:text="#{region.list.title}">Listado de Regiones</h2>

    <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>
    <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>

    <a th:href="@{/regions/new}" class="btn btn-success mb-3" th:text="#{region.add.new}">Añadir Nueva Región</a>

    <table class="table table-bordered table-hover">
        <thead>
        <tr>
            <th scope="col" th:with="order=${page.sort.getOrderFor('id')},
                                     dir=${order != null ? order.direction.name().toLowerCase() : 'asc'},
                                     nextDir=${dir == 'asc' ? 'desc' : 'asc'}">
                <a class="text-decoration-none" th:href="@{/regions(page=${page.number}, size=${page.size}, sort='id,' + ${nextDir})}">
                    <span th:text="#{region.id}">ID</span>
                    <span class="ms-1" th:if="${order != null}" th:text="${dir == 'asc' ? ' ▲' : ' ▼'}"></span>
                </a>
            </th>

            <th scope="col" th:with="order=${page.sort.getOrderFor('code')},
                                     dir=${order != null ? order.direction.name().toLowerCase() : 'asc'},
                                     nextDir=${dir == 'asc' ? 'desc' : 'asc'}">
                <a class="text-decoration-none" th:href="@{/regions(page=${page.number}, size=${page.size}, sort='code,' + ${nextDir})}">
                    <span th:text="#{region.code}">Código</span>
                    <span class="ms-1" th:if="${order != null}" th:text="${dir == 'asc' ? ' ▲' : ' ▼'}"></span>
                </a>
            </th>

            <th scope="col" th:with="order=${page.sort.getOrderFor('name')},
                                     dir=${order != null ? order.direction.name().toLowerCase() : 'asc'},
                                     nextDir=${dir == 'asc' ? 'desc' : 'asc'}">
                <a class="text-decoration-none" th:href="@{/regions(page=${page.number}, size=${page.size}, sort='name,' + ${nextDir})}">
                    <span th:text="#{region.name}">Nombre</span>
                    <span class="ms-1" th:if="${order != null}" th:text="${dir == 'asc' ? ' ▲' : ' ▼'}"></span>
                </a>
            </th>

            <th scope="col" th:text="#{region.actions}">Acciones</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="region : ${page.content}">
            <td th:text="${region.id}"></td>
            <td th:text="${region.code}"></td>
            <td th:text="${region.name}"></td>
            <td class="d-flex gap-1">
                <a th:href="@{/regions/detail(id=${region.id})}" class="btn btn-info btn-sm" th:text="#{region.detail}">Detalle</a>
                <a th:href="@{/regions/edit(id=${region.id})}" class="btn btn-warning btn-sm" th:text="#{region.edit}">Editar</a>
                <form th:action="@{/regions/delete}" method="get" style="display:inline;" onsubmit="return confirm('¿Estás seguro?')">
                    <input type="hidden" name="id" th:value="${region.id}" />
                    <button type="submit" class="btn btn-danger btn-sm" th:text="#{region.delete}">Eliminar</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>

    <div class="d-flex justify-content-between align-items-center mt-3" th:if="${page.totalPages > 0}">

        <div>
            <span th:text="#{msg.pagination.info(${page.number} + 1, ${page.totalPages}, ${page.totalElements})}"></span>
        </div>

        <nav th:aria-label="#{msg.pagination.aria.label}">
            <ul class="pagination mb-0">
                <li class="page-item" th:classappend="${page.first} ? ' disabled'">
                    <a class="page-link" th:href="@{/regions(page=${page.number - 1}, size=${page.size}, sort=${sortParam})}">
                        <span aria-hidden="true">&laquo;</span>
                    </a>
                </li>

                <li class="page-item" th:each="i : ${#numbers.sequence(0, page.totalPages - 1)}"
                    th:classappend="${i} == ${page.number} ? ' active'">
                    <a class="page-link" th:text="${i + 1}" th:href="@{/regions(page=${i}, size=${page.size}, sort=${sortParam})}"></a>
                </li>

                <li class="page-item" th:classappend="${page.last} ? ' disabled'">
                    <a class="page-link" th:href="@{/regions(page=${page.number + 1}, size=${page.size}, sort=${sortParam})}">
                        <span aria-hidden="true">&raquo;</span>
                    </a>
                </li>
            </ul>
        </nav>
    </div>
</main>

<footer th:replace="fragments/footer :: footer"></footer>
<div th:replace="fragments/scripts :: scripts"></div>
</body>
</html>
