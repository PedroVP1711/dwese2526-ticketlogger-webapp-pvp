<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/head :: head('User Detail')"></head>

<body class="d-flex flex-column h-100">

<header th:replace="fragments/header :: header"></header>

<main class="form-page">
    <div class="form-card">

        <h1>
            <span th:text="#{msg.users-detail.title}"></span>:
            <span th:text="${user.email}"></span>
        </h1>

        <dl class="row mt-3">
            <dt class="col-sm-3">ID</dt>
            <dd class="col-sm-9" th:text="${user.id}"></dd>

            <dt class="col-sm-3">Email</dt>
            <dd class="col-sm-9" th:text="${user.email}"></dd>

            <dt class="col-sm-3">Activo</dt>
            <dd class="col-sm-9"
                th:text="${user.active} ? #{msg.common.yes} : #{msg.common.no}"></dd>

            <dt class="col-sm-3">Bloqueado</dt>
            <dd class="col-sm-9"
                th:text="${user.accountNonLocked} ? #{msg.common.yes} : #{msg.common.no}"></dd>

            <dt class="col-sm-3">Intentos fallidos</dt>
            <dd class="col-sm-9" th:text="${user.failedLoginAttempts}"></dd>

            <dt class="col-sm-3">Roles</dt>
            <dd class="col-sm-9">
                <ul th:if="${!#lists.isEmpty(user.roles)}">
                    <li th:each="role : ${user.roles}" th:text="${role}"></li>
                </ul>
                <span th:if="${#lists.isEmpty(user.roles)}" class="text-muted">
                    Sin roles
                </span>
            </dd>
        </dl>

        <a th:href="@{/user}" class="btn btn-secondary">Volver</a>
        <a th:href="@{/user/edit(id=${user.id})}" class="btn btn-primary">Editar</a>

    </div>
</main>

<footer th:replace="fragments/footer :: footer"></footer>
</body>
</html>
