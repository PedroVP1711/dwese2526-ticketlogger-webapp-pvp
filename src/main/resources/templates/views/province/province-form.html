<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/head :: head('User Form')"></head>

<body class="d-flex flex-column h-100">

<header th:replace="fragments/header :: header"></header>

<main class="form-page">
    <div class="form-card">

        <h1 th:text="#{msg.form-title}"></h1>

        <div th:if="${errorMessage}" class="alert alert-danger"
             th:text="${errorMessage}"></div>

        <form th:action="@{${user.id == null} ? '/user/insert' : '/user/update'}"
              th:object="${user}"
              method="post"
              class="mt-3">

            <input type="hidden" th:field="*{id}" />

            <!-- Email -->
            <div class="mb-3">
                <label class="form-label"
                       th:text="#{msg.users-form.email}"></label>
                <input type="text"
                       th:field="*{email}"
                       class="form-control"
                       required />
            </div>

            <!-- Roles -->
            <div class="mb-3">
                <label class="form-label">Roles</label>
                <select class="form-select"
                        th:field="*{roleIds}"
                        multiple>
                    <option th:each="role : ${allRoles}"
                            th:value="${role.id}"
                            th:text="${role.displayName} + ' (' + ${role.name} + ')'">
                    </option>
                </select>
            </div>

            <!-- Checkboxes -->
            <div class="form-check mb-2">
                <input type="checkbox"
                       th:field="*{active}"
                       class="form-check-input" />
                <label class="form-check-label">Activo</label>
            </div>

            <div class="form-check mb-2">
                <input type="checkbox"
                       th:field="*{accountNonLocked}"
                       class="form-check-input" />
                <label class="form-check-label">Cuenta no bloqueada</label>
            </div>

            <div class="form-check mb-2">
                <input type="checkbox"
                       th:field="*{emailVerified}"
                       class="form-check-input" />
                <label class="form-check-label">Email verificado</label>
            </div>

            <div class="form-check mb-3">
                <input type="checkbox"
                       th:field="*{mustChangePassword}"
                       class="form-check-input" />
                <label class="form-check-label">Debe cambiar contraseña</label>
            </div>

            <button type="submit"
                    class="btn btn-primary"
                    th:text="${user.id == null} ? 'Crear' : 'Actualizar'">
            </button>

            <a th:href="@{/user}" class="btn btn-secondary">Cancelar</a>

        </form>
    </div>
</main>

<footer th:replace="fragments/footer :: footer"></footer>
</body>
</html>
