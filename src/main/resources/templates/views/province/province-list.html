<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/head :: head(#{msg.province-list.title})"></head>
<body class="d-flex flex-column h-100">
<header th:replace="fragments/header :: header"></header>

<div class="container">
    <h2 class="mt-4 mb-4" th:text="#{msg.province-list.title}">Listado de Provincias</h2>

    <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>
    <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

    <p class="mb-3">
        <a th:href="@{/provinces/new}" class="btn btn-primary" th:text="#{msg.province-list.add}">
            Agregar Nueva Provincia
        </a>
    </p>

    <table class="table table-striped table-hover">
        <thead class="table-dark">
        <tr>
            <th>
                <a th:href="@{/provinces(page=${currentPage}, size=${pageSize}, sortField='id', sortDir=${sortDir == 'asc' ? 'desc' : 'asc'})}" th:text="#{msg.province-list.id}">
                    ID
                    <span th:if="${sortField == 'id'}">
                        <span th:classappend="${sortDir == 'asc' ? '▲' : '▼'}"></span>
                    </span>
                </a>
            </th>
            <th>
                <a th:href="@{/provinces(page=${currentPage}, size=${pageSize}, sortField='code', sortDir=${sortDir == 'asc' ? 'desc' : 'asc'})}" th:text="#{msg.province-list.code}">
                    Código
                    <span th:if="${sortField == 'code'}">
                        <span th:classappend="${sortDir == 'asc' ? '▲' : '▼'}"></span>
                    </span>
                </a>
            </th>
            <th>
                <a th:href="@{/provinces(page=${currentPage}, size=${pageSize}, sortField='name', sortDir=${sortDir == 'asc' ? 'desc' : 'asc'})}" th:text="#{msg.province-list.name}">
                    Nombre
                    <span th:if="${sortField == 'name'}">
                        <span th:classappend="${sortDir == 'asc' ? '▲' : '▼'}"></span>
                    </span>
                </a>
            </th>
            <th>
                <a th:href="@{/provinces(page=${currentPage}, size=${pageSize}, sortField='region.name', sortDir=${sortDir == 'asc' ? 'desc' : 'asc'})}" th:text="#{msg.province-list.region}">
                    Comunidad Autónoma
                    <span th:if="${sortField == 'region.name'}">
                        <span th:classappend="${sortDir == 'asc' ? '▲' : '▼'}"></span>
                    </span>
                </a>
            </th>
            <th th:text="#{msg.province-list.actions}">Acciones</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="province : ${provinces}">
            <td th:text="${province.id}">1</td>
            <td th:text="${province.code}">C01</td>
            <td th:text="${province.name}">Provincia Uno</td>
            <td th:text="${province.region != null ? province.region.name : 'No disponible'}">Andalucía</td>
            <td>
                <a th:href="@{/provinces/detail(id=${province.id})}" class="btn btn-sm btn-secondary me-2"
                   th:text="#{msg.province-list.detail}">Detalles</a>

                <a th:href="@{/provinces/edit(id=${province.id})}" class="btn btn-sm btn-info me-2"
                   th:text="#{msg.province-list.edit}">Editar</a>
                <form th:action="@{/provinces/delete}" method="post" style="display:inline;"
                      th:onsubmit="'return confirm(\'' + #{msg.province-list.confirm} + '\');'">
                    <input type="hidden" name="id" th:value="${province.id}" />
                    <button type="submit" class="btn btn-sm btn-danger" th:text="#{msg.province-list.delete}">
                        Eliminar
                    </button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>

    <div th:if="${provinces != null && provinces.isEmpty()}" class="alert alert-warning text-center">
        No hay provincias registradas.
    </div>

    <div class="d-flex justify-content-between align-items-center mt-3" th:if="${totalPages > 0}">
        <div>
            <span th:text="#{msg.pagination.info(${currentPage} + 1, ${totalPages}, ${totalElements})}"></span>
        </div>

        <nav th:aria-label="#{msg.pagination.aria.label}">
            <ul class="pagination mb-0">
                <li class="page-item" th:classappend="${currentPage == 0} ? ' disabled'">
                    <a class="page-link" th:href="@{/provinces(page=${currentPage - 1}, size=${pageSize}, sortField=${sortField}, sortDir=${sortDir})}" th:aria-label="#{msg.pagination.prev}">
                        <span aria-hidden="true">&laquo;</span>
                    </a>
                </li>

                <li class="page-item" th:each="i : ${#numbers.sequence(0, totalPages - 1)}" th:classappend="${i} == ${currentPage} ? ' active'">
                    <a class="page-link" th:text="${i + 1}" th:href="@{/provinces(page=${i}, size=${pageSize}, sortField=${sortField}, sortDir=${sortDir})}"></a>
                </li>

                <li class="page-item" th:classappend="${currentPage == totalPages - 1} ? ' disabled'">
                    <a class="page-link" th:href="@{/provinces(page=${currentPage + 1}, size=${pageSize}, sortField=${sortField}, sortDir=${sortDir})}" th:aria-label="#{msg.pagination.next}">
                        <span aria-hidden="true">&raquo;</span>
                    </a>
                </li>
            </ul>
        </nav>
    </div>
</div>

<footer th:replace="fragments/footer :: footer"></footer>
</body>
</html>
