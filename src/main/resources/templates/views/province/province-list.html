<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/head :: head(#{msg.province-list.title})"></head>
<body class="d-flex flex-column h-100">
<header th:replace="fragments/header :: header"></header>

<main class="container py-4">
    <h2 class="mb-4" th:text="#{msg.province-list.title}">Listado de Provincias</h2>

    <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>
    <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

    <p class="mb-3">
        <a th:href="@{/provinces/new}" class="btn btn-primary" th:text="#{msg.province-list.add}">
            Agregar Nueva Provincia
        </a>
    </p>

    <table class="table table-striped table-hover">
        <thead class="table-dark">
        <tr>
            <th scope="col" th:with="order=${page.sort.getOrderFor('id')},
                                     dir=${order != null ? order.direction.name().toLowerCase() : 'asc'},
                                     nextDir=${dir == 'asc' ? 'desc' : 'asc'}">
                <a class="text-decoration-none text-white" th:href="@{/provinces(page=${page.number}, size=${page.size}, sort='id,' + ${nextDir})}">
                    <span th:text="#{msg.province-list.id}">ID</span>
                    <span class="ms-1" th:if="${order != null}" th:text="${dir == 'asc' ? '▲' : '▼'}"></span>
                </a>
            </th>

            <th scope="col" th:with="order=${page.sort.getOrderFor('code')},
                                     dir=${order != null ? order.direction.name().toLowerCase() : 'asc'},
                                     nextDir=${dir == 'asc' ? 'desc' : 'asc'}">
                <a class="text-decoration-none text-white" th:href="@{/provinces(page=${page.number}, size=${page.size}, sort='code,' + ${nextDir})}">
                    <span th:text="#{msg.province-list.code}">Código</span>
                    <span class="ms-1" th:if="${order != null}" th:text="${dir == 'asc' ? '▲' : '▼'}"></span>
                </a>
            </th>

            <th scope="col" th:with="order=${page.sort.getOrderFor('name')},
                                     dir=${order != null ? order.direction.name().toLowerCase() : 'asc'},
                                     nextDir=${dir == 'asc' ? 'desc' : 'asc'}">
                <a class="text-decoration-none text-white" th:href="@{/provinces(page=${page.number}, size=${page.size}, sort='name,' + ${nextDir})}">
                    <span th:text="#{msg.province-list.name}">Nombre</span>
                    <span class="ms-1" th:if="${order != null}" th:text="${dir == 'asc' ? '▲' : '▼'}"></span>
                </a>
            </th>

            <th scope="col" th:with="order=${page.sort.getOrderFor('region.name')},
                                     dir=${order != null ? order.direction.name().toLowerCase() : 'asc'},
                                     nextDir=${dir == 'asc' ? 'desc' : 'asc'}">
                <a class="text-decoration-none text-white" th:href="@{/provinces(page=${page.number}, size=${page.size}, sort='region.name,' + ${nextDir})}">
                    <span th:text="#{msg.province-list.region}">Región</span>
                    <span class="ms-1" th:if="${order != null}" th:text="${dir == 'asc' ? '▲' : '▼'}"></span>
                </a>
            </th>

            <th th:text="#{msg.province-list.actions}">Acciones</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="province : ${page.content}">
            <td th:text="${province.id}"></td>
            <td th:text="${province.code}"></td>
            <td th:text="${province.name}"></td>
            <td th:text="${province.region != null ? province.region.name : 'No disponible'}"></td>
            <td>
                <div class="d-flex gap-2">
                    <a th:href="@{/provinces/detail(id=${province.id})}" class="btn btn-sm btn-secondary"
                       th:text="#{msg.province-list.detail}">Detalles</a>
                    <a th:href="@{/provinces/edit(id=${province.id})}" class="btn btn-sm btn-info"
                       th:text="#{msg.province-list.edit}">Editar</a>
                    <form th:action="@{/provinces/delete}" method="post" class="d-inline"
                          th:onsubmit="return confirm([[#{msg.province-list.confirm}]])">
                        <input type="hidden" name="id" th:value="${province.id}" />
                        <button type="submit" class="btn btn-sm btn-danger" th:text="#{msg.province-list.delete}">
                            Eliminar
                        </button>
                    </form>
                </div>
            </td>
        </tr>
        </tbody>
    </table>

    <div th:if="${page.isEmpty()}" class="alert alert-warning text-center">
        No hay provincias registradas.
    </div>

    <div class="d-flex justify-content-between align-items-center mt-3" th:if="${page.totalPages > 0}">
        <div>
            <span th:text="#{msg.pagination.info(${page.number} + 1, ${page.totalPages}, ${page.totalElements})}"></span>
        </div>

        <nav th:aria-label="#{msg.pagination.aria.label}">
            <ul class="pagination mb-0">
                <li class="page-item" th:classappend="${page.first} ? ' disabled'">
                    <a class="page-link" th:href="@{/provinces(page=${page.number - 1}, size=${page.size}, sort=${sortParam})}">
                        <span aria-hidden="true">&laquo;</span>
                    </a>
                </li>

                <li class="page-item" th:each="i : ${#numbers.sequence(0, page.totalPages - 1)}"
                    th:classappend="${i == page.number} ? ' active'">
                    <a class="page-link" th:text="${i + 1}" th:href="@{/provinces(page=${i}, size=${page.size}, sort=${sortParam})}"></a>
                </li>

                <li class="page-item" th:classappend="${page.last} ? ' disabled'">
                    <a class="page-link" th:href="@{/provinces(page=${page.number + 1}, size=${page.size}, sort=${sortParam})}">
                        <span aria-hidden="true">&raquo;</span>
                    </a>
                </li>
            </ul>
        </nav>
    </div>
</main>

<footer th:replace="fragments/footer :: footer"></footer>
</body>
</html>
