<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/head :: head('User Form')"></head>

<body class="d-flex flex-column h-100">

<header th:replace="fragments/header :: header"></header>

<main class="form-page">
    <div class="form-card">
        <h1 th:text="#{msg.form-title}"></h1> <!-- Título dinámico -->

        <!-- Mostrar mensaje de error si existe -->
        <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

        <!-- Formulario dinámico -->
        <form th:action="@{${user.id == null} ? '/user/insert' : '/user/update'}" th:object="${user}" method="post" class="mt-3">

            <!-- Campo oculto para el ID -->
            <input type="hidden" th:field="*{id}" />

            <!-- Campo de nombre de usuario -->
            <div class="mb-3">
                <label for="email" class="form-label" th:text="#{msg.users-form.email}"></label>
                <input type="text" th:field="*{email}" id="email" class="form-control" required
                       th:classappend="${#fields.hasErrors('email')} ? ' is-invalid' : ''" />
                <div th:if="${#fields.hasErrors('email')}" class="invalid-feedback">
                    <p th:each="err : ${#fields.errors('email')}" th:text="${err}"></p>
                </div>
            </div>

            <!-- Campo de contraseña -->
            <div class="mb-3" th:if="${user.id == null}">
                <label for="passwordCreate" class="form-label" th:text="#{msg.users-form.password}"></label>
                <input type="password" th:field="*{password}" id="passwordCreate" class="form-control" required
                       th:classappend="${#fields.hasErrors('password')} ? ' is-invalid' : ''" />
                <div th:if="${#fields.hasErrors('password')}" class="invalid-feedback">
                    <p th:each="err : ${#fields.errors('password')}" th:text="${err}"></p>
                </div>
                <small><i th:text="#{msg.users-form.passwordHint}"></i></small>
            </div>

            <!-- Campos de Roles -->
            <div class="mb-3">
                <label for="roles" class="form-label" th:text="#{msg.user-form.roles}">Roles</label>
                <select id="roles" class="form-select" th:field="*{roleIds}" multiple>
                    <option th:each="role : ${allRoles}"
                            th:value="${role.id}"
                            th:text="${role.displayName} + ' (' + ${role.name} + ')'">
                    </option>
                </select>
            </div>


            <!-- Para edición, contraseña opcional -->
            <div class="mb-3" th:if="${user.id != null}">
                <label for="passwordEdit" class="form-label" th:text="#{msg.users-form.passwordOptional}"></label>
                <input type="password" th:field="*{password}" id="passwordEdit" class="form-control"
                       th:classappend="${#fields.hasErrors('password')} ? ' is-invalid' : ''" />
                <small><i th:text="#{msg.users-form.passwordHintEdit}"></i></small>
                <div th:if="${#fields.hasErrors('password')}" class="invalid-feedback">
                    <p th:each="err : ${#fields.errors('password')}" th:text="${err}"></p>
                </div>
            </div>

            <!-- Campos de checkboxes -->
            <div class="mb-3 form-check">
                <input type="checkbox" th:field="*{active}" class="form-check-input" id="active" />
                <label class="form-check-label" for="active" th:text="#{msg.users-form.active}"></label>
            </div>

            <div class="mb-3 form-check">
                <input type="checkbox" th:field="*{accountNonLocked}" class="form-check-input" id="accountNonLocked" />
                <label class="form-check-label" for="accountNonLocked" th:text="#{msg.users-form.accountNonLocked}"></label>
            </div>

            <div class="mb-3 form-check">
                <input type="checkbox" th:field="*{emailVerified}" class="form-check-input" id="emailVerified" />
                <label class="form-check-label" for="emailVerified" th:text="#{msg.users-form.emailVerified}"></label>
            </div>

            <div class="mb-3 form-check">
                <input type="checkbox" th:field="*{mustChangePassword}" class="form-check-input" id="mustChangePassword" />
                <label class="form-check-label" for="mustChangePassword" th:text="#{msg.users-form.mustChangePassword}"></label>
            </div>

            <!-- Botones de acción -->
            <div class="mt-3">
                <button type="submit" class="btn btn-primary" th:if="${user.id == null}"
                        th:text="#{msg.users-form.create}"></button>
                <button type="submit" class="btn btn-primary" th:if="${user.id != null}"
                        th:text="#{msg.users-form.update}"></button>

                <a th:href="@{/user}" class="btn btn-secondary" th:text="#{msg.users-form.cancel}"></a>
            </div>
        </form>
    </div>
</main>

<footer th:replace="fragments/footer :: footer"></footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-ka7Sk0Gln4gmtz2MlQnikT1wXgYsOg+OMhuP+IlRH9sENBO0LRn5q+8nbTov4+1p" crossorigin="anonymous"></script>

</body>
</html>
