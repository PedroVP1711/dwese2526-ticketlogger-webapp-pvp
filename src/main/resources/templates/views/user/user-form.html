<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/head :: head(#{user.form.title})"></head>

<body class="d-flex flex-column h-100">

<header th:replace="fragments/header :: header"></header>

<main class="form-page">
    <div class="form-card">

        <div class="text-center mb-3">
            <img th:src="${user.userProfile.profileImagePath != null} ?
                  ${user.userProfile.profileImagePath} :
                  @{/images/avatar.svg}"
                 alt="Avatar"
                 class="img-thumbnail rounded-circle"
                 style="width: 120px; height: 120px; object-fit: cover;">
        </div>

        <h1 th:if="${user.id == null}" th:text="#{msg.user-form.add}">Añadir Usuario</h1>
        <h1 th:if="${user.id != null}" th:text="#{msg.user-form.edit}">Editar Usuario</h1>

        <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

        <form th:action="@{/users/save}"
              th:object="${user}"
              method="post"
              enctype="multipart/form-data"
              class="mt-3">

            <input type="hidden" th:field="*{id}" />

            <div class="mb-3">
                <label for="email" class="form-label" th:text="#{msg.user-form.email}">Correo Electrónico</label>
                <input type="email" id="email" th:field="*{email}" class="form-control" />
                <div th:if="${#fields.hasErrors('email')}" class="text-danger" th:errors="*{email}"></div>
            </div>

            <div class="mb-3">
                <label for="passwordHash" class="form-label" th:text="#{msg.user-form.password}">Contraseña</label>
                <input type="password" id="passwordHash" name="passwordHash" th:field="*{password}" class="form-control" />
                <div th:if="${#fields.hasErrors('password')}" class="text-danger" th:errors="*{password}"></div>
            </div>

            <hr class="mt-4 mb-3"/>
            <h5 th:text="#{msg.user-form.security_settings}">Configuración de Seguridad</h5>

            <div class="row">
                <div class="col-md-4 mb-3 form-check form-switch">
                    <input type="checkbox" id="active" th:field="*{enabled}" class="form-check-input" role="switch"/>
                    <label class="form-check-label" for="active" th:text="#{msg.user-form.active}">Activo</label>
                </div>
                <div class="col-md-4 mb-3 form-check form-switch">
                    <input type="checkbox" id="accountNonLocked" th:field="*{accountNonLocked}" class="form-check-input" role="switch"/>
                    <label class="form-check-label" for="accountNonLocked" th:text="#{msg.user-form.nonlocked}">No Bloqueado</label>
                </div>
                <div class="col-md-4 mb-3 form-check form-switch">
                    <input type="checkbox" id="mustChangePassword" th:field="*{mustChangePassword}" class="form-check-input" role="switch"/>
                    <label class="form-check-label" for="mustChangePassword" th:text="#{msg.user-form.mustchange}">Cambiar Contraseña</label>
                </div>
            </div>

            <div class="row">
                <div class="col-md-6 mb-3">
                    <label for="failedLoginAttempts" class="form-label" th:text="#{msg.user-form.failed_attempts}">Intentos Fallidos</label>
                    <input type="number" id="failedLoginAttempts" th:field="*{failedLoginAttempts}" class="form-control" min="0" />
                </div>
                <div class="col-md-6 mb-3 form-check form-switch mt-4 pt-2">
                    <input type="checkbox" id="emailVerified" th:field="*{emailVerified}" class="form-check-input" role="switch"/>
                    <label class="form-check-label" for="emailVerified" th:text="#{msg.user-form.email_verified}">Email Verificado</label>
                </div>
            </div>

            <div class="mb-3">
                <label for="profileImageFile" class="form-label" th:text="#{msg.userProfile.field.profileImageUpload}"></label>
                <input type="file"
                       id="profileImageFile"
                       th:field="*{userProfile.profileImageFile}"
                       class="form-control"
                       accept="image/*" />
            </div>

            <div class="mt-4">
                <button th:if="${user.id == null}" type="submit" class="btn btn-primary" th:text="#{msg.user-form.create}">Crear</button>
                <button th:if="${user.id != null}" type="submit" class="btn btn-primary" th:text="#{msg.user-form.update}">Actualizar</button>
                <a th:href="@{/users}" class="btn btn-secondary" th:text="#{msg.user-form.returnback}">Volver</a>
            </div>
        </form>
    </div>
</main>


<footer th:replace="fragments/footer :: footer"></footer>
<div th:replace="fragments/scripts :: scripts"></div>

</body>
</html>
