<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/head :: head(#{msg.user-detail.title})"></head>

<body class="d-flex flex-column h-100">

<header th:replace="fragments/header :: header"></header>

<main class="detail-page container py-4">

    <h2 class="h5 mb-4" th:text="#{msg.user-detail.section.userData}">
        Datos del usuario
    </h2>

    <dl class="row">

        <dt class="col-sm-3">ID</dt>
        <dd class="col-sm-9" th:text="${user.id}"></dd>

        <dt class="col-sm-3" th:text="#{user.email}">Email</dt>
        <dd class="col-sm-9" th:text="${user.email}"></dd>

        <dt class="col-sm-3" th:text="#{user.active}">Activo</dt>
        <dd class="col-sm-9">
            <span th:if="${user.active}" class="text-success">✔</span>
            <span th:unless="${user.active}" class="text-danger">❌</span>
        </dd>

        <dt class="col-sm-3" th:text="#{user.locked}">Bloqueado</dt>
        <dd class="col-sm-9">
            <span th:if="${user.accountNonLocked}" class="text-success">✔</span>
            <span th:unless="${user.accountNonLocked}" class="text-danger">❌</span>
        </dd>

        <dt class="col-sm-3" th:text="#{user.email_verified}">Email verificado</dt>
        <dd class="col-sm-9">
            <span th:if="${user.emailVerified}" class="text-success">✔</span>
            <span th:unless="${user.emailVerified}" class="text-danger">❌</span>
        </dd>

        <dt class="col-sm-3">Roles</dt>
        <dd class="col-sm-9">
            <span th:each="role : ${user.roles}"
                  th:text="${role.name}"
                  class="badge bg-primary me-1">
            </span>
        </dd>

    </dl>

    <div class="mt-4">
        <a th:href="@{/users}" class="btn btn-secondary">
            Volver al listado
        </a>
    </div>

</main>

<footer th:replace="fragments/footer :: footer"></footer>
<div th:replace="fragments/scripts :: scripts"></div>

</body>
</html>
